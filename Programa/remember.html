<!DOCTYPE html>
<html lang="eng">
<head>
    <style>
        div{border:1px solid black}
        .box{border:1px solid pink; 
            display: inline-block;
            width: 100px;
            height: 100px;
        }
        #box1{background-color:blueviolet;
        position: fixed;
        top: 0px;
        left: 0px;
        }
        #box2{background-color:aqua;
        position: fixed;
        top: 0px;
        right: 0px
        }
        #box3{background-color:red;
        position: fixed;
        bottom: 0px;
        left: 0px
        }
        #box4{background-color:yellow;
        position: absolute;
        bottom: 0px;
        right: 0px
        }
        #box5{background-color:purple;
        position: fixed;
        top: 50%;
        right: 50%;
        transform: translate(50%, -50%);
        }
    </style>
</head>
<body>
    <hr>
    <h1>Positions </h1>
    <div id="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>

    </div>
    <!--div.container>div#box$.box{bos$}*5 para fazer um container (como o de cima)-->

</body>
</html>
