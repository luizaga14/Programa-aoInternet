<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box, .container{border: 1px solid black;}
        .container{
        display: flex;
        justify-content: space-around; 
        flex-direction: row;
        align-items: center;
        height: 100vh;
        }
        #box3{order: -1;
            flex-grow: 1;
        }
        #box2{flex-grow: 1;
        }
    </style>
</head>
 <!-- justify-content      justificação de texto: center(centro), space-around(), space-between(), space-evelyn()-->
 <!-- flex-direction       justificação de texto: colum(sla), row(), row-reverse(), sla-sla()-->
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
